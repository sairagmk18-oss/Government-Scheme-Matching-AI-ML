<!DOCTYPE html>
<html>

<head>

    <title>Government Scheme Matcher</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #6aed61;
            color: white;
            border: white;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Government Scheme Matcher</h1>

    <form action="/result" method="POST">

        <label>Age</label>
        <input type="number" name="age" required>

        <label>Annual Income</label>
        <input type="number" name="income" required>

        <label>Occupation</label>
        <select name="occupation">

            <option value="Student">Student</option>
            <option value="Farmer">Farmer</option>
            <option value="Employee">Employee</option>
            <option value="Unemployed">Unemployed</option>

        </select>

        <label>Category</label>
        <select name="category">

            <option value="General">General</option>
            <option value="OBC">OBC</option>
            <option value="SC">SC</option>
            <option value="ST">ST</option>

        </select>

        <label>Gender</label>
        <select name="gender">

            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>

        </select>

        <label>State</label>
        <input
            type="text"
            name="state"
            placeholder="Example: Kerala"
            required
        >

        <button type="submit">
            Check Eligible Schemes
        </button>

    </form>

</div>

</body>

</html>
